# Example dr-strange configuration. Copy to `drsg.toml` (auto-loaded from the
# working directory) or point at it with `drsg --config <path>` or $DRSG_CONFIG.
#
# Every section is optional; anything omitted falls back to its default. Values
# here are folded into the process environment at startup, so an environment
# variable that is already set ALWAYS wins over the file — handy for injecting
# secrets at launch without editing this file.

[server]
# Listen address. A `--addr` on the command line overrides this.
addr = "0.0.0.0:7700"
# Shared API token (→ DRSG_TOKEN). When set, every request must carry it
# (`Authorization: Bearer <token>`; WebSocket via `?token=<token>`). When unset,
# the API is reachable only from the local browser UI.
token = "change-me"
# Maximum requests processed at once; excess requests queue. Default 1024.
max_concurrent = 1024
# How long a write waits for the single writer slot before failing with a
# retryable timeout (JSON-RPC -32002). One process holds the database, so a long
# bulk import or digest blocks every other writer while it runs; a bound turns
# that into an answer instead of a hang. Default 30. Set 0 to wait forever.
write_timeout_secs = 30
# How long one request's queries may run before stopping with the same retryable
# timeout. Bounds an agent's runaway MATCH so it cannot occupy the server
# indefinitely. Cooperative and row-paced: it stops work that flows, not a graph
# algorithm mid-iteration. Default 60. Set 0 to run to completion.
query_timeout_secs = 60
# Extra browser origins allowed past the CSRF guard (→ DRSG_ALLOWED_ORIGINS).
allowed_origins = ["https://app.example.com"]

# Uncomment to serve HTTPS directly (rustls). Both files are PEM; `cert` is the
# certificate chain, `key` its private key. Omit the whole section for plain
# HTTP (e.g. when a reverse proxy terminates TLS in front).
# [server.tls]
# cert = "/etc/drsg/cert.pem"
# key  = "/etc/drsg/key.pem"

[logging]
# Directory for the daily-rolling log file (→ DRSG_LOG_DIR). Default `./logs`.
dir = "logs"

# LLM API keys, by environment-variable name → secret. These feed the provider
# layer (used by `digest` and text-`SEARCH`), which looks keys up by env-var
# name. Keys stay server-side and never travel from a client.
[llm]
# OPENAI_API_KEY = "sk-..."
# DEEPSEEK_API_KEY = "..."
# DASHSCOPE_API_KEY = "..."   # Qwen / DashScope

# Server-side ingestion tuning. A digest.run request may override the first two.
[digest]
# Per-chunk extraction chat calls to run concurrently. Default 8.
# concurrency = 8
# Target chunk size in characters, paragraph-aware. Default 4000.
# chunk_chars = 4000
# Setting embed_provider turns on embed-on-write for /mcp's write_nodes: nodes
# an agent writes get a vector built from the same recipe `digest` uses (key +
# labels + text properties) and stored in the same `embedding` property, so both
# land in one index and one search finds both. Off unless set — an agent then
# has to supply its own vectors, and one that forgets writes nodes no vector
# search will ever return. A node that already carries `embedding` is untouched.
# Costs one provider round-trip per write_nodes call (the batch is embedded in
# one request, not one per node).
# embed_provider = "openai"
# embed_model = "text-embedding-3-small"
# embed_key_env = "OPENAI_API_KEY"

# Preprocessor plugins (ROADMAP §11): sandboxed wasm components installed with
# `drsg plugin install <file.wasm | url>`. Budgets apply per sandbox call.
[plugins]
# fuel = 200000000000    # instructions per call; 0 disables the check
# memory_mb = 3072       # linear memory per call (wasm32 caps at 4096 anyway)

# Each plugin's own settings, passed through uninterpreted — what a plugin can
# be configured to do is the plugin's business, not the database's.
# [plugins.rust]
# include_source = true  # store each function's source under `_code`
