[project]
name = "drsg"
version = "0.1.0"
description = "Python client for dr-strange (drsg serve JSON-RPC)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # stdlib only

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drsg"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `import codegen`

[tool.ruff.lint]
# The generated client mirrors wire param names (id, type, set), which shadow
# builtins; that's intentional and lives behind a per-file noqa in the codegen.
ignore = ["A002"]
