[project]
name = "drsg"
version = "2.24.1"
description = "Python client for dr-strange (drsg serve JSON-RPC)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # stdlib only

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drsg"]
# PEP 561: the package is typed; the marker has to travel in the wheel for
# consumers' type checkers to read the annotations. `packages` already
# includes every file under src/drsg, and this keeps it so if that changes.
artifacts = ["src/drsg/py.typed"]

[dependency-groups]
# Not raised past PYSEC-2026-1845 (pytest's tmpdir handling, fixed in 9.0.3)
# on purpose: pytest 9 needs Python 3.10, this package supports 3.9, and the
# advisory is a local issue in a test runner that is never installed by a
# consumer of this SDK. Revisit when `requires-python` moves to 3.10.
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `import codegen`

[tool.ruff.lint]
# `A` (builtin shadowing) and `S310` (unaudited URL open) are extended onto the
# default set rather than replacing it, because the code already answers both:
# the generated client mirrors wire param names (id, type, set) that shadow
# builtins and carries a per-file noqa for it, and `_client.py` opens a fixed
# http(s) endpoint it built itself. Neither rule was enabled before, so both
# those directives sat dead — `RUF100` is what noticed.
extend-select = [
    "A",
    "S310",
    # The hundred-line limit, the same one `clippy::too_many_lines` holds over
    # the Rust crates. Ruff counts statements, as clippy does, so comments and
    # blank lines are free.
    "PLR0915",
]

[tool.ruff.lint.pylint]
max-statements = 100
