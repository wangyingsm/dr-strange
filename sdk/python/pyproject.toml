[project]
name = "drsg"
version = "2.7.0"
description = "Python client for dr-strange (drsg serve JSON-RPC)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # stdlib only

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drsg"]
# PEP 561: the package is typed; the marker has to travel in the wheel for
# consumers' type checkers to read the annotations. `packages` already
# includes every file under src/drsg, and this keeps it so if that changes.
artifacts = ["src/drsg/py.typed"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `import codegen`

[tool.ruff.lint]
# The generated client mirrors wire param names (id, type, set), which shadow
# builtins; that's intentional and lives behind a per-file noqa in the codegen.
ignore = ["A002"]
