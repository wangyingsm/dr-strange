[package]
name = "drsg-bench"
description = "Cross-engine benchmark harness for dr-strange (dev-only; not part of the shipped product)"
# A harness for measuring this workspace against other engines, run from a
# checkout. There is nothing for a dependant to depend on.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "drsg-bench"
path = "src/main.rs"

[dependencies]
mimalloc = { workspace = true }
# The workspace dep is default-features = false; the bench measures the
# shipping default backend, so select it explicitly.
dr-strange-core = { workspace = true, features = ["native-backend"] }
ahash = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[lints]
workspace = true
