# The accuracy benchmark's cross-checks, for the keys whose oracle this
# project's authors cannot run locally.
#
# C# is the reason this exists: its fixture was written on a machine with no
# C# compiler, so its key shipped marked `unverified`. A runner has the .NET
# SDK, so Roslyn can say whether the key is right. Java, Python and C ride
# along because their oracles — the JDK, the interpreter, and gcc — are
# already here, and a key that drifts should fail on the commit that drifts
# it. Kotlin brings its own compiler, fetched and checksummed below.
#
# Rust is deliberately absent: `cargo expand` checks only its macro entry, and
# that is run locally by `just accuracy`. Installing a Rust toolchain here to
# re-run one assertion would buy nothing.
name: Accuracy

on:
  push:
    branches: [master]
    paths: ["benchmarks/accuracy/**", ".github/workflows/accuracy.yml"]
  pull_request:
    paths: ["benchmarks/accuracy/**", ".github/workflows/accuracy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accuracy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keys:
    name: Keys agree with their oracles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
      # Pinned exactly, as ci.yml explains: setup-uv stopped publishing a
      # floating major tag after v7, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The one the laptop cannot do.
      - name: C# — Roslyn
        run: uv run --no-project --with tomli python benchmarks/accuracy/crosscheck_csharp.py

      # Fetched rather than taken from a third-party action: this repository
      # pins what it runs and verifies what it downloads, and a setup action
      # for one compiler is more supply chain than a checksummed zip.
      - name: Kotlin compiler
        env:
          KOTLIN_VERSION: "2.2.21"
          KOTLIN_SHA256: "a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714"
        run: |
          set -euo pipefail
          url="https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          curl -fsSL --retry 3 --retry-all-errors -o kotlin.zip "$url"
          echo "${KOTLIN_SHA256}  kotlin.zip" | sha256sum -c -
          unzip -q kotlin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Kotlin — compiled bytecode
        run: uv run --no-project --with tomli python benchmarks/accuracy/crosscheck_kotlin.py

      # These need nothing a runner does not already have.
      - name: Java — compiled bytecode
        run: uv run --no-project --with tomli python benchmarks/accuracy/crosscheck_java.py
      - name: Python — a real execution trace
        run: uv run --no-project --with tomli python benchmarks/accuracy/crosscheck_py.py
      - name: C — the object code
        run: uv run --no-project --with tomli python benchmarks/accuracy/crosscheck_c.py
