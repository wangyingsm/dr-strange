name: Docs

# Publish the tutorial book (both editions) to GitHub Pages on every push to
# master. Enable once under Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

# Read-only by default; only the job that deploys asks for Pages.
permissions:
  contents: read

# One deployment at a time; don't cancel a publish mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: mdbook
      # Keep the en/book + zh/book layout so the cross-edition links
      # (../../zh/book/index.html) resolve. The site root is the landing page
      # rather than a redirect into the book: someone arriving from a link has
      # not yet decided to read a manual.
      - name: Build both editions
        run: |
          mdbook build docs/en
          mdbook build docs/zh
          mkdir -p _site/en _site/zh
          cp -r docs/en/book _site/en/book
          cp -r docs/zh/book _site/zh/book
          # `cp -r docs/landing/.` rather than the directory itself, so
          # `zh/index.html` lands beside `zh/book/` instead of replacing it.
          cp -r docs/landing/. _site/
          test -f _site/index.html && test -f _site/zh/index.html
          test -d _site/zh/book && test -d _site/en/book
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write # publish the built book
      id-token: write # the Pages deployment is OIDC-authenticated
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
