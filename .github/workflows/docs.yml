name: Docs

# Publish the tutorial book (both editions) to GitHub Pages on every push to
# master. Enable once under Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a publish mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: mdbook
      # Keep the en/book + zh/book layout so the cross-edition links
      # (../../zh/book/index.html) resolve, and land visitors on the English
      # edition from the site root.
      - name: Build both editions
        run: |
          mdbook build docs/en
          mdbook build docs/zh
          mkdir -p _site/en _site/zh
          cp -r docs/en/book _site/en/book
          cp -r docs/zh/book _site/zh/book
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./en/book/index.html">
          <link rel="canonical" href="./en/book/index.html">
          <title>Dr Strange — Documentation</title>
          <a href="./en/book/index.html">Dr Strange documentation</a>
          HTML
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
