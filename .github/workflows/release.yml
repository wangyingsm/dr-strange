name: Release

# Cut a release by pushing a semver tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

# Read-only by default; each job that writes asks for exactly what it writes.
# A token scoped at the top is handed to every job, including the ones that
# only compile — and that is what an audit flags.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    name: Binaries — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux runners are pinned, not `-latest`: the runner's glibc is
          # the oldest glibc the released binary can run on, and `ubuntu-latest`
          # moving to 24.04 silently raised that floor to 2.39 — v2.0.0-alpha's
          # first build refused to start on a 22.04 host that ran v1.7.0 fine.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS, cross-compiled from the Arm runner (the Xcode SDK is
          # universal); keeps the one-liner installer working on Intel Macs.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Swatinem/rust-cache's default key does not vary by target, only by OS —
      # so two matrix legs on one runner (the two macOS targets share
      # macos-latest) or a runner-label change between releases (ubuntu-latest
      # -> ubuntu-22.04, below) restore a cache built for a DIFFERENT target
      # onto this one. Cargo trusts the fingerprints and skips rebuilding
      # crates whose actual artifacts are missing or incompatible, which
      # surfaces as "can't find crate" for something deep in the graph
      # (wasmtime, here) rather than as a cache-miss. `key` scopes the cache
      # to this matrix leg exactly.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Build the real dashboard so it is embedded into the release binary
      # rather than the build.rs placeholder.
      - name: Build frontend
        # --frozen-lockfile: the dashboard embedded in a release is built from
        # exactly the dependency set the committed bun.lock names, never from
        # a fresh resolution the release run happened to get.
        run: |
          bun install --frozen-lockfile
          bun run build
        working-directory: crates/dr-strange-web/frontend
      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} -p dr-strange-cli -p dr-strange-mcp
      # bash on every runner (Git Bash on Windows) so one script covers all
      # platforms; Windows ships .exe binaries and a .zip, the rest tar.gz.
      - name: Package
        shell: bash
        run: |
          target="${{ matrix.target }}"
          dist="dr-strange-${GITHUB_REF_NAME}-$target"
          bin="target/$target/release"
          ext=""
          [[ "$target" == *windows* ]] && ext=".exe"
          mkdir "$dist"
          cp "$bin/drsg$ext" "$bin/drsg-mcp$ext" "$dist/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dist/"
          if [[ "$target" == *windows* ]]; then
            archive="$dist.zip"
            7z a -tzip "$archive" "$dist" > /dev/null
          else
            archive="$dist.tar.gz"
            tar -czf "$archive" "$dist"
          fi
          # sha256sum on Linux; shasum on macOS.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dr-strange-*.tar.gz
            dr-strange-*.tar.gz.sha256
            dr-strange-*.zip
            dr-strange-*.zip.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the assets
      id-token: write # Sigstore signing, keyless
      attestations: write # record the provenance against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Pull this version's section out of CHANGELOG.md for the release body.
      # The auto-generated commit list is appended below it.
      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag && $0 !~ /^\[[0-9]/ { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release body -----"; cat RELEASE_NOTES.md
      # SLSA build provenance, signed through Sigstore with no key to keep:
      # each archive gets an attestation naming the workflow, commit and
      # runner that produced it. Before publishing, so a release never exists
      # without one.
      #
      #   gh attestation verify <archive> --repo wangyingsm/dr-strange
      - name: Attest the archives
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dr-strange-*.tar.gz
            dist/dr-strange-*.zip
      # The attestation also ships as a release asset, for two reasons: it can
      # then be verified offline, against the archive alone, by anyone who
      # would rather not ask GitHub's API; and an audit that reads releases
      # (OpenSSF Scorecard among them) cannot see provenance recorded only
      # against the repository.
      - name: Publish the provenance beside the archives
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/dr-strange-${GITHUB_REF_NAME}.intoto.jsonl"
      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/dr-strange-*.tar.gz
            dist/dr-strange-*.tar.gz.sha256
            dist/dr-strange-*.zip
            dist/dr-strange-*.zip.sha256
            dist/dr-strange-*.intoto.jsonl
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # A hyphen in the tag (v2.0.0-alpha, -rc.1, …) is semver's pre-release
          # marker; flag the GitHub release to match, so nobody does it by hand.
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm:
    name: npm packages
    # After the GitHub release exists, not beside it: the packages carry the
    # same binaries, and a published npm version pointing at a release that
    # failed to appear is the one ordering that cannot be undone.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance, which attests these came from this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # A fork, or a clone of this repository before the secret is added, has
      # no token. That skips the job rather than failing the release — npm is
      # one distribution channel, and the binaries are already published.
      - name: Is a token configured?
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "present=${NPM_TOKEN:+yes}" >> "$GITHUB_OUTPUT"
      - name: Build the packages
        if: steps.token.outputs.present == 'yes'
        run: python3 packaging/npm/build.py "${GITHUB_REF_NAME#v}" --from dist
      - name: Publish
        if: steps.token.outputs.present == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # A hyphen is semver's pre-release marker, as the release job reads
          # it: such a version must not become what `npm install drsg` gets.
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          # The wrapper goes last: its optionalDependencies pin this exact
          # version, so publishing it first leaves a window where installing
          # drsg resolves to packages that do not exist yet.
          for pkg in drsg-linux-x64 drsg-linux-arm64 drsg-darwin-x64 \
                     drsg-darwin-arm64 drsg-win32-x64 drsg; do
            # Re-running a release must not fail on what it already did. Only
            # a real 404 means "not published": any other failure is the
            # registry being unreachable, and guessing "publish" there would
            # hand npm a conflict and report it as the wrong problem.
            if out=$(npm view "$pkg@$version" version 2>&1); then
              echo "$pkg@$version is already published — skipping"
              continue
            elif ! grep -q 'E404' <<<"$out"; then
              echo "$out" >&2
              echo "could not ask the registry about $pkg@$version" >&2
              exit 1
            fi
            (cd "packaging/npm/dist/$pkg" \
              && npm publish --access public --provenance --tag "$tag")
          done

  wheels:
    name: Python wheel — ${{ matrix.target }}
    # After the GitHub release, for the reason the npm job gives: a published
    # version pointing at a release that never appeared cannot be withdrawn.
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same five legs the binaries are built on, including the glibc
        # floor the Linux pins exist for — a wheel that will not load on a
        # 22.04 host is the same bug in a different package format.
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Keyed by target for the reason the binaries job records: two legs on
      # one runner would otherwise restore each other's cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wheel-${{ matrix.target }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # One wheel per platform rather than per interpreter: the module uses
      # only Python's stable ABI, so 3.9 and 3.14 load the same file.
      - name: Build
        run: uvx maturin build --release --target ${{ matrix.target }} --out dist
        working-directory: crates/dr-strange-py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: crates/dr-strange-py/dist/*.whl

  pypi:
    name: Publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # A fork, or this repository before the secret exists, has no token.
      # That skips the publish rather than failing the release — PyPI is one
      # channel, and the binaries and the GitHub release are already out.
      - name: Is a token configured?
        id: token
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: echo "present=${PYPI_TOKEN:+yes}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.token.outputs.present == 'yes'
      - name: Publish
        if: steps.token.outputs.present == 'yes'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*.whl

  docker:
    name: Docker image → GHCR
    permissions:
      contents: read
      packages: write # push the image to GHCR
    # Reuse the natively-built linux binaries instead of recompiling Rust under
    # QEMU emulation (which made this job ~50 min); the image build is now a COPY.
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*-linux-gnu # the two linux targets only
          merge-multiple: true
          path: dist
      - name: Lay out drsg by Docker arch
        run: |
          mkdir -p /tmp/x /tmp/a
          tar -xzf dist/dr-strange-*-x86_64-unknown-linux-gnu.tar.gz -C /tmp/x
          tar -xzf dist/dr-strange-*-aarch64-unknown-linux-gnu.tar.gz -C /tmp/a
          install -Dm755 /tmp/x/*/drsg bin/amd64/drsg
          install -Dm755 /tmp/a/*/drsg bin/arm64/drsg
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `v1.2.3` → tags 1.2.3, 1.2, and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
