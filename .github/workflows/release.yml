name: Release

# Cut a release by pushing a semver tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload assets
  packages: write # push the image to GHCR

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    name: Binaries — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # Build the real dashboard so it is embedded into the release binary
      # rather than the build.rs placeholder.
      - name: Build frontend
        # Not --frozen-lockfile: the committed bun.lock is a bun-canary format
        # (lockfileVersion 2) that setup-bun's stable bun can't parse.
        run: |
          bun install
          bun run build
        working-directory: crates/dr-strange-web/frontend
      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} -p dr-strange-cli -p dr-strange-mcp
      - name: Package
        run: |
          dist="dr-strange-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/drsg" "target/${{ matrix.target }}/release/drsg-mcp" "$dist/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dist/"
          tar -czf "$dist.tar.gz" "$dist"
          sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dr-strange-*.tar.gz
            dr-strange-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dr-strange-*.tar.gz
            dist/dr-strange-*.tar.gz.sha256
          generate_release_notes: true

  docker:
    name: Docker image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `v1.2.3` → tags 1.2.3, 1.2, and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
