name: Release

# Cut a release by pushing a semver tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload assets
  packages: write # push the image to GHCR

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    name: Binaries — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux runners are pinned, not `-latest`: the runner's glibc is
          # the oldest glibc the released binary can run on, and `ubuntu-latest`
          # moving to 24.04 silently raised that floor to 2.39 — v2.0.0-alpha's
          # first build refused to start on a 22.04 host that ran v1.7.0 fine.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS, cross-compiled from the Arm runner (the Xcode SDK is
          # universal); keeps the one-liner installer working on Intel Macs.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Swatinem/rust-cache's default key does not vary by target, only by OS —
      # so two matrix legs on one runner (the two macOS targets share
      # macos-latest) or a runner-label change between releases (ubuntu-latest
      # -> ubuntu-22.04, below) restore a cache built for a DIFFERENT target
      # onto this one. Cargo trusts the fingerprints and skips rebuilding
      # crates whose actual artifacts are missing or incompatible, which
      # surfaces as "can't find crate" for something deep in the graph
      # (wasmtime, here) rather than as a cache-miss. `key` scopes the cache
      # to this matrix leg exactly.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Build the real dashboard so it is embedded into the release binary
      # rather than the build.rs placeholder.
      - name: Build frontend
        # Not --frozen-lockfile: the committed bun.lock is a bun-canary format
        # (lockfileVersion 2) that setup-bun's stable bun can't parse.
        run: |
          bun install
          bun run build
        working-directory: crates/dr-strange-web/frontend
      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} -p dr-strange-cli -p dr-strange-mcp
      # bash on every runner (Git Bash on Windows) so one script covers all
      # platforms; Windows ships .exe binaries and a .zip, the rest tar.gz.
      - name: Package
        shell: bash
        run: |
          target="${{ matrix.target }}"
          dist="dr-strange-${GITHUB_REF_NAME}-$target"
          bin="target/$target/release"
          ext=""
          [[ "$target" == *windows* ]] && ext=".exe"
          mkdir "$dist"
          cp "$bin/drsg$ext" "$bin/drsg-mcp$ext" "$dist/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dist/"
          if [[ "$target" == *windows* ]]; then
            archive="$dist.zip"
            7z a -tzip "$archive" "$dist" > /dev/null
          else
            archive="$dist.tar.gz"
            tar -czf "$archive" "$dist"
          fi
          # sha256sum on Linux; shasum on macOS.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist-${{ matrix.target }}
          path: |
            dr-strange-*.tar.gz
            dr-strange-*.tar.gz.sha256
            dr-strange-*.zip
            dr-strange-*.zip.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Pull this version's section out of CHANGELOG.md for the release body.
      # The auto-generated commit list is appended below it.
      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag && $0 !~ /^\[[0-9]/ { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release body -----"; cat RELEASE_NOTES.md
      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/dr-strange-*.tar.gz
            dist/dr-strange-*.tar.gz.sha256
            dist/dr-strange-*.zip
            dist/dr-strange-*.zip.sha256
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # A hyphen in the tag (v2.0.0-alpha, -rc.1, …) is semver's pre-release
          # marker; flag the GitHub release to match, so nobody does it by hand.
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Docker image → GHCR
    # Reuse the natively-built linux binaries instead of recompiling Rust under
    # QEMU emulation (which made this job ~50 min); the image build is now a COPY.
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: dist-*-linux-gnu # the two linux targets only
          merge-multiple: true
          path: dist
      - name: Lay out drsg by Docker arch
        run: |
          mkdir -p /tmp/x /tmp/a
          tar -xzf dist/dr-strange-*-x86_64-unknown-linux-gnu.tar.gz -C /tmp/x
          tar -xzf dist/dr-strange-*-aarch64-unknown-linux-gnu.tar.gz -C /tmp/a
          install -Dm755 /tmp/x/*/drsg bin/amd64/drsg
          install -Dm755 /tmp/a/*/drsg bin/arm64/drsg
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # `v1.2.3` → tags 1.2.3, 1.2, and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
