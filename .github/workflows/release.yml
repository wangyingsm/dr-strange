name: Release

# Cut a release by pushing a semver tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload assets
  packages: write # push the image to GHCR

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    name: Binaries — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS, cross-compiled from the Arm runner (the Xcode SDK is
          # universal); keeps the one-liner installer working on Intel Macs.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # Build the real dashboard so it is embedded into the release binary
      # rather than the build.rs placeholder.
      - name: Build frontend
        # Not --frozen-lockfile: the committed bun.lock is a bun-canary format
        # (lockfileVersion 2) that setup-bun's stable bun can't parse.
        run: |
          bun install
          bun run build
        working-directory: crates/dr-strange-web/frontend
      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} -p dr-strange-cli -p dr-strange-mcp
      # bash on every runner (Git Bash on Windows) so one script covers all
      # platforms; Windows ships .exe binaries and a .zip, the rest tar.gz.
      - name: Package
        shell: bash
        run: |
          target="${{ matrix.target }}"
          dist="dr-strange-${GITHUB_REF_NAME}-$target"
          bin="target/$target/release"
          ext=""
          [[ "$target" == *windows* ]] && ext=".exe"
          mkdir "$dist"
          cp "$bin/drsg$ext" "$bin/drsg-mcp$ext" "$dist/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dist/"
          if [[ "$target" == *windows* ]]; then
            archive="$dist.zip"
            7z a -tzip "$archive" "$dist" > /dev/null
          else
            archive="$dist.tar.gz"
            tar -czf "$archive" "$dist"
          fi
          # sha256sum on Linux; shasum on macOS.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.target }}
          path: |
            dr-strange-*.tar.gz
            dr-strange-*.tar.gz.sha256
            dr-strange-*.zip
            dr-strange-*.zip.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Pull this version's section out of CHANGELOG.md for the release body.
      # The auto-generated commit list is appended below it.
      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag && $0 !~ /^\[[0-9]/ { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release body -----"; cat RELEASE_NOTES.md
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/dr-strange-*.tar.gz
            dist/dr-strange-*.tar.gz.sha256
            dist/dr-strange-*.zip
            dist/dr-strange-*.zip.sha256
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

  docker:
    name: Docker image → GHCR
    # Reuse the natively-built linux binaries instead of recompiling Rust under
    # QEMU emulation (which made this job ~50 min); the image build is now a COPY.
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*-linux-gnu # the two linux targets only
          merge-multiple: true
          path: dist
      - name: Lay out drsg by Docker arch
        run: |
          mkdir -p /tmp/x /tmp/a
          tar -xzf dist/dr-strange-*-x86_64-unknown-linux-gnu.tar.gz -C /tmp/x
          tar -xzf dist/dr-strange-*-aarch64-unknown-linux-gnu.tar.gz -C /tmp/a
          install -Dm755 /tmp/x/*/drsg bin/amd64/drsg
          install -Dm755 /tmp/a/*/drsg bin/arm64/drsg
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `v1.2.3` → tags 1.2.3, 1.2, and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
