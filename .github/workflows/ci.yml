name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (native backend)
        run: cargo clippy --workspace --all-targets
      - name: Test (native backend)
        run: cargo test --workspace
      # The legacy redb engine is opt-in; smoke-test it so it never rots.
      - name: Test (redb backend)
        run: cargo test -p dr-strange-core --no-default-features --features redb-backend,json
      # Ship the CLI binary to the SDK jobs so they don't each rebuild it. The
      # web crate's build.rs emits a placeholder dashboard when frontend/dist is
      # absent, so `drsg` builds here without the bun toolchain — the SDK e2e
      # suites exercise /rpc and /ws, not the SPA.
      - name: Build drsg
        run: cargo build -p dr-strange-cli
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: drsg
          path: target/debug/drsg
          if-no-files-found: error
          retention-days: 1

  features:
    name: Features — every optional build still compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The `rust` job builds one configuration: all defaults. Every feature
      # this project documents as optional is therefore unbuilt by CI, and a
      # `#[cfg]` that should have been added is invisible until someone tries
      # the combination — which is how `--no-default-features` on the CLI came
      # to be broken for several releases with nothing going red.
      #
      # `--all-targets` because the tests are part of the configuration: a test
      # helper used only by gated tests is dead code in the build without them.
      #
      # A storage backend is not optional, only which one — `--no-default-features`
      # with neither leaves `Database` without an `open`, by design — so each
      # line below names one.
      - name: CLI without the digest pipeline (native backend)
        run: |
          cargo clippy -p dr-strange-cli --no-default-features --features native-backend --all-targets
          cargo test -p dr-strange-cli --no-default-features --features native-backend
      - name: CLI without the digest pipeline (redb backend)
        run: cargo clippy -p dr-strange-cli --no-default-features --features redb-backend --all-targets
      # The wasm plugin host ships on; `--no-default-features` drops the whole
      # runtime, which is the build for anyone who does not want it.
      - name: LLM crate without the plugin host
        run: |
          cargo clippy -p dr-strange-llm --no-default-features --all-targets
          cargo test -p dr-strange-llm --no-default-features
      - name: MCP server on the redb backend
        run: cargo clippy -p dr-strange-mcp --no-default-features --features redb-backend --all-targets
      - name: Web crate on the redb backend
        run: cargo clippy -p dr-strange-web --no-default-features --features redb-backend --all-targets

  frontend:
    name: Frontend — lint + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        # Not --frozen-lockfile: the committed bun.lock is lockfileVersion 2
        # (written by a bun canary) which setup-bun's stable bun can't parse;
        # let it resolve fresh instead of failing to read the lock.
        run: bun install
        working-directory: crates/dr-strange-web/frontend
      # `no-undef` specifically: neither vite nor bun errors on a reference to
      # an identifier that does not exist, so a function lost in a refactor
      # builds green and throws at runtime — which is how the graph plot once
      # shipped an empty canvas.
      - name: Lint
        run: bun run lint
        working-directory: crates/dr-strange-web/frontend
      - name: Build
        run: bun run build
        working-directory: crates/dr-strange-web/frontend
      - name: Test
        run: bun test
        working-directory: crates/dr-strange-web/frontend

  docs:
    name: Docs — mdBook build (en + zh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: mdbook
      - name: Build (en)
        run: mdbook build docs/en
      - name: Build (zh)
        run: mdbook build docs/zh

  sdk-typescript:
    name: SDK — TypeScript
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install # not --frozen: the committed lock is a bun-canary format
        working-directory: sdk/typescript
      - name: Test (drift + e2e)
        run: bun test
        working-directory: sdk/typescript

  sdk-python:
    name: SDK — Python
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      # Pinned exactly: setup-uv stopped publishing a floating major tag after
      # v7, so `@v9` does not resolve even though v9.0.0 is the latest release.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Test (drift + e2e)
        run: uv run --with pytest pytest -q
        working-directory: sdk/python

  sdk-go:
    name: SDK — Go
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sdk/go/go.sum
      - name: Test (drift + e2e)
        run: go test ./...
        working-directory: sdk/go

  sdk-java:
    name: SDK — Java
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test (drift + e2e)
        run: ./mvnw -q -B test
        working-directory: sdk/java

  sdk-c:
    name: SDK — C
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libjson-c-dev
      - name: Test (drift + e2e)
        run: make test
        working-directory: sdk/c

  # What no compiler answers: licences, RUSTSEC advisories and the registries a
  # crate may come from (`deny.toml`), dependencies a refactor stopped using,
  # and the Python SDK's lint — the one member no job above compiles.
  #
  # Independent of `rust`: it reads the manifests and the lockfile rather than a
  # build, so it starts at once and reports on its own instead of behind the
  # matrix. An advisory published overnight turns this red with nothing of ours
  # changed, which is why it runs on every push rather than before a release.
  supply:
    name: Supply chain — deny, machete, ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: Licences, advisories, sources
        run: cargo deny check
      - name: Unused dependencies
        run: cargo machete
      # Pinned exactly, as in sdk-python: setup-uv stopped publishing a floating
      # major tag after v7.
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Lint
        run: uv run --with ruff ruff check .
        working-directory: sdk/python
      # The bench scripts belong to no package, so they carry the SDK's rules
      # explicitly rather than inheriting a pyproject they are not under.
      - name: Lint (benchmarks)
        run: |
          uv run --no-project --with ruff ruff check benchmarks/ \
            --extend-select PLR0915 --config 'lint.pylint.max-statements=100'
