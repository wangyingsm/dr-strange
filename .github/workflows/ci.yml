name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (native backend)
        run: cargo clippy --workspace --all-targets
      - name: Test (native backend)
        run: cargo test --workspace
      # The legacy redb engine is opt-in; smoke-test it so it never rots.
      - name: Test (redb backend)
        run: cargo test -p dr-strange-core --no-default-features --features redb-backend,json
      # Ship the CLI binary to the SDK jobs so they don't each rebuild it. The
      # web crate's build.rs emits a placeholder dashboard when frontend/dist is
      # absent, so `drsg` builds here without the bun toolchain — the SDK e2e
      # suites exercise /rpc and /ws, not the SPA.
      - name: Build drsg
        run: cargo build -p dr-strange-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drsg
          path: target/debug/drsg
          if-no-files-found: error
          retention-days: 1

  features:
    name: Features — every optional build still compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-11
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The `rust` job builds one configuration: all defaults. Every feature
      # this project documents as optional is therefore unbuilt by CI, and a
      # `#[cfg]` that should have been added is invisible until someone tries
      # the combination — which is how `--no-default-features` on the CLI came
      # to be broken for several releases with nothing going red.
      #
      # `--all-targets` because the tests are part of the configuration: a test
      # helper used only by gated tests is dead code in the build without them.
      #
      # A storage backend is not optional, only which one — `--no-default-features`
      # with neither leaves `Database` without an `open`, by design — so each
      # line below names one.
      - name: CLI without the digest pipeline (native backend)
        run: |
          cargo clippy -p dr-strange-cli --no-default-features --features native-backend --all-targets
          cargo test -p dr-strange-cli --no-default-features --features native-backend
      - name: CLI without the digest pipeline (redb backend)
        run: cargo clippy -p dr-strange-cli --no-default-features --features redb-backend --all-targets
      # The wasm plugin host ships on; `--no-default-features` drops the whole
      # runtime, which is the build for anyone who does not want it.
      - name: LLM crate without the plugin host
        run: |
          cargo clippy -p dr-strange-llm --no-default-features --all-targets
          cargo test -p dr-strange-llm --no-default-features
      - name: MCP server on the redb backend
        run: cargo clippy -p dr-strange-mcp --no-default-features --features redb-backend --all-targets
      - name: Web crate on the redb backend
        run: cargo clippy -p dr-strange-web --no-default-features --features redb-backend --all-targets

  frontend:
    name: Frontend — lint + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        # --frozen-lockfile: CI builds exactly the dependency set the committed
        # bun.lock names and fails if package.json has drifted from it, so a
        # resolver change or an upstream re-publish cannot slip a different
        # tree into the dashboard. Regenerate the lock with `bun install`
        # locally when a dependency is meant to change.
        run: bun install --frozen-lockfile
        working-directory: crates/dr-strange-web/frontend
      # `no-undef` specifically: neither vite nor bun errors on a reference to
      # an identifier that does not exist, so a function lost in a refactor
      # builds green and throws at runtime — which is how the graph plot once
      # shipped an empty canvas.
      - name: Lint
        run: bun run lint
        working-directory: crates/dr-strange-web/frontend
      - name: Build
        run: bun run build
        working-directory: crates/dr-strange-web/frontend
      - name: Test
        run: bun test
        working-directory: crates/dr-strange-web/frontend

  docs:
    name: Docs — mdBook build (en + zh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: mdbook
      - name: Links and EN/ZH parity
        run: python3 scripts/check_docs.py
      - name: Build (en)
        run: mdbook build docs/en
      - name: Build (zh)
        run: mdbook build docs/zh

  # The repository's own Claude Code hooks: the usage report writes a
  # watermark on the user's behalf, and how it does that (private directory,
  # exclusive 0600 temporary, never through a planted link) is pinned by a
  # unittest module beside it. Standard library only; the runner's python3.
  hooks:
    name: Hooks — usage-report watermark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest discover -s .claude/hooks -v

  sdk-typescript:
    name: SDK — TypeScript
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile # the committed lock is the contract
        working-directory: sdk/typescript
      - name: Test (drift + e2e)
        run: bun test
        working-directory: sdk/typescript

  sdk-python:
    name: SDK — Python
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      # Pinned exactly: setup-uv stopped publishing a floating major tag after
      # v7, so `@v9` does not resolve even though v9.0.0 is the latest release.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Test (drift + e2e)
        run: uv run --locked pytest -q
        working-directory: sdk/python

  sdk-go:
    name: SDK — Go
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sdk/go/go.sum
      - name: Test (drift + e2e)
        run: go test ./...
        working-directory: sdk/go

  sdk-java:
    name: SDK — Java
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test (drift + e2e)
        run: ./mvnw -q -B test
        working-directory: sdk/java

  sdk-c:
    name: SDK — C
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libjson-c-dev
      - name: Test (drift + e2e)
        run: make test
        working-directory: sdk/c

  sdk-zig:
    name: SDK — Zig
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drsg
          path: bin
      - name: Point at drsg
        run: |
          chmod +x bin/drsg
          echo "DRSG_BIN=$GITHUB_WORKSPACE/bin/drsg" >> "$GITHUB_ENV"
      # The Zig client compiles the C client's sources and links the same
      # system libraries through pkg-config, so it needs what sdk-c needs.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libjson-c-dev pkg-config
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build
        run: zig build
        working-directory: sdk/zig
      - name: Test (e2e against a real drsg serve)
        run: test/run.sh
        working-directory: sdk/zig
  # What no compiler answers: licences, RUSTSEC advisories and the registries a
  # crate may come from (`deny.toml`), dependencies a refactor stopped using,
  # and the Python SDK's lint — the one member no job above compiles.
  #
  # Independent of `rust`: it reads the manifests and the lockfile rather than a
  # build, so it starts at once and reports on its own instead of behind the
  # matrix. An advisory published overnight turns this red with nothing of ours
  # changed, which is why it runs on every push rather than before a release.
  supply:
    name: Supply chain — deny, machete, ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny,cargo-machete
      - name: Licences, advisories, sources
        run: cargo deny check
      - name: Unused dependencies
        run: cargo machete
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Lint
        run: uv run --locked --with ruff ruff check .
        working-directory: sdk/python
      # The bench scripts belong to no package, so they carry the SDK's rules
      # explicitly rather than inheriting a pyproject they are not under.
      - name: Lint (benchmarks)
        run: |
          uv run --no-project --with ruff ruff check benchmarks/ \
            --extend-select PLR0915 --config 'lint.pylint.max-statements=100'
