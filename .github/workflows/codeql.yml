# CodeQL: GitHub's static analysis, reading each language for the bug classes a
# linter does not look for — injection, path traversal, unsafe deserialization.
# Clippy already guards Rust style and many correctness traps; this answers a
# different question, and findings land in the Security tab beside Scorecard's.
name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    - cron: "41 5 * * 2" # Tuesdays, offset from the Scorecard run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write # file the results against this repository
      contents: read
      actions: read
    strategy:
      # One language failing must not cancel the rest: they are independent
      # analyses, and a partial result is worth more than none.
      fail-fast: false
      matrix:
        include:
          # `actions` reads the workflows themselves — the most relevant
          # language in the tree for a supply-chain question.
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          # Rust is compiled, but its extractor is buildless: CodeQL refuses
          # `autobuild` for it outright ("Rust does not support the autobuild
          # build mode"), so nothing here compiles the workspace.
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
