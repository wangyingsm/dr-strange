# Dependency updates. Grouped and weekly: this repository is usually moved by
# one person, and an ungrouped daily feed is a feed nobody reads.
#
# Added after an OpenSSF Scorecard run found nine advisories sitting in the
# dashboard's transitive build dependencies — the kind of thing that accrues
# silently between releases, which is exactly what a bot is for.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  # Both JS trees are bun-only — a `bun.lock` and no `package-lock.json` — and
  # the npm_and_yarn updater refuses to touch that, so it must be `bun` here.
  - package-ecosystem: bun
    directory: /crates/dr-strange-web/frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # sigma 4 dropped the `EdgeProgram` and `DEFAULT_EDGE_ARROW_HEAD_PROGRAM_OPTIONS`
      # exports that `@sigma/edge-curve` imports from `sigma/rendering`, and 3.1.0 is
      # the newest that plugin has — `plot.js` needs its `EdgeCurvedArrowProgram` to
      # draw parallel edges apart. Hold sigma at 3 until the plugin builds against 4,
      # and drop this entry then; it is a blocked upgrade, not an unwanted one.
      - dependency-name: sigma
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /sdk/typescript
    schedule:
      interval: weekly
    groups:
      sdk-typescript:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    groups:
      sdk-python:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly

  - package-ecosystem: maven
    directory: /sdk/java
    schedule:
      interval: weekly
