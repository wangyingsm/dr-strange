[package]
name = "dr-strange-web"
description = "drsg serve — JSON-RPC 2.0 web backend + dashboard for dr-strange (arch/08)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["native-backend"]
# Storage backend, forwarded to core + the embedded MCP tool set. The
# hand-rolled LSM engine is the default; `redb-backend` selects the legacy v1
# engine.
redb-backend = ["dr-strange-core/redb-backend", "dr-strange-mcp/redb-backend"]
native-backend = ["dr-strange-core/native-backend", "dr-strange-mcp/native-backend"]

[dependencies]
ahash = { workspace = true }
dr-strange-core = { workspace = true, features = ["json"] }
dr-strange-llm = { path = "../dr-strange-llm" }
# The MCP tool set (arch/06), reused (not reimplemented) to host it at `/mcp`
# (ROADMAP §10) — the served endpoint and the `drsg-mcp` stdio binary drive
# the identical tool code, just over different transports.
# `default-features = false` for the same reason `[workspace.dependencies]`
# gives for core: the backend is this crate's choice to forward, and the
# binary's default (`native-backend`) would otherwise reach core through here
# even in a `--no-default-features --features redb-backend` build — where
# core's `cfg(all(redb-backend, not(native-backend)))` would then silently
# select the native engine anyway.
dr-strange-mcp = { path = "../dr-strange-mcp", default-features = false }
dr-strange-parser.workspace = true
axum = { version = "0.8", features = ["ws"] }
# Streamable HTTP MCP transport for `/mcp` (ROADMAP §10). `server` pulls in
# the tool macros dr-strange-mcp's `DrStrange` needs. Version comes from the
# workspace: this crate and dr-strange-mcp exchange rmcp types, so the two must
# resolve to one build of it.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
# Native TLS for `drsg serve` (arch/08). axum-server drives the accept loop with
# a rustls acceptor; `no-provider` + an explicit `ring` provider keeps the build
# off the aws-lc-rs C toolchain.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Production hardening middleware (arch/08): a global in-flight concurrency cap
# (tower) plus panic→500 and static security headers (tower-http).
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["catch-panic", "set-header", "limit"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rust-embed = "8"
mime_guess = "2"
tracing.workspace = true
# URL ingestion for the digest page (ROADMAP §9). `scraper` (html5ever) parses
# real-world HTML — the tag-stripping in extract.rs exists for docx XML and
# would render a navigation bar as prose; `ego-tree` is scraper's own tree type,
# needed to name node handles in the walker and pinned to the version scraper
# resolves so both see one crate.
scraper = "0.27"
ego-tree = "0.11"
url = "2"
# ureq rather than reqwest (which is only a dev-dependency here, for tests)
# because of `AgentBuilder::resolver`: the SSRF guard must be the thing that
# hands ureq the addresses to connect to, not a check made beforehand that the
# client is then free to re-resolve. See fetch/guard.rs.
ureq = { version = "2", default-features = false, features = ["tls"] }
# WebSocket client for `serve --follow` (arch/01 §9): the follower dials the
# master's `/ws/wal`. `rustls-tls-webpki-roots` matches the rustls + ring
# provider axum-server already installs for inbound TLS, so there's no second
# TLS stack in the binary.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# `StreamExt`/`SinkExt` for the `WebSocketStream` in `follow.rs` — a direct
# dependency because a transitive crate's traits can't be named in `use`.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Encodes/decodes `ReplicatedBatch` for `/ws/wal` — same version dr-strange-core
# uses for its own WAL, so both ends agree on the wire format.
postcard = { version = "1.1.3", features = ["use-std"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
# A real MCP client, to drive /mcp end-to-end in tests/mcp.rs the way an
# agent host actually would, not just over raw HTTP.
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
