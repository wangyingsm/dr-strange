[package]
name = "dr-strange-web"
description = "drsg serve — JSON-RPC 2.0 web backend + dashboard for dr-strange (arch/08)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["native-backend"]
# Storage backend, forwarded to core. The hand-rolled LSM engine is the default;
# `redb-backend` selects the legacy v1 engine.
redb-backend = ["dr-strange-core/redb-backend"]
native-backend = ["dr-strange-core/native-backend"]

[dependencies]
dr-strange-core = { workspace = true, features = ["json"] }
dr-strange-llm = { path = "../dr-strange-llm" }
dr-strange-parser.workspace = true
axum = { version = "0.8", features = ["ws"] }
# Native TLS for `drsg serve` (arch/08). axum-server drives the accept loop with
# a rustls acceptor; `no-provider` + an explicit `ring` provider keeps the build
# off the aws-lc-rs C toolchain.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Production hardening middleware (arch/08): a global in-flight concurrency cap
# (tower) plus panic→500 and static security headers (tower-http).
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["catch-panic", "set-header"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rust-embed = "8"
mime_guess = "2"
tracing.workspace = true
# Server-side document text extraction for the digest page. 0.7 emitted its
# per-glyph font/unicode warnings with raw `println!`, flooding stdout on PDFs
# with broken unicode maps — extraction slowed to a crawl (a perceived hang).
# 0.12 routes them through the `log` crate instead (some at `warn!`), so there
# are no raw writes regardless of logging. NOTE: if we later add tracing, filter
# the `pdf_extract` target to `error`/off (e.g. EnvFilter "info,pdf_extract=error")
# or those per-glyph warns will flood the logs again. See extract.rs.
pdf-extract = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
