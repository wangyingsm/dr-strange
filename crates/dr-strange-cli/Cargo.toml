[package]
name = "dr-strange-cli"
description = "drsg — command-line tools for dr-strange (arch/05)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "drsg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
dr-strange-core = { workspace = true, features = ["json"] }
dr-strange-web = { path = "../dr-strange-web" }
serde_json = "1.0.151"
