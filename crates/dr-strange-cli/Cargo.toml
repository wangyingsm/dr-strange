[package]
name = "dr-strange-cli"
description = "drsg — command-line tools for dr-strange (arch/05)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "drsg"
path = "src/main.rs"

[features]
# `drsg digest` (LLM ingest, arch/07). On by default; build with
# --no-default-features to drop the HTTP/LLM dependency chain.
default = ["digest", "redb-backend"]
digest = ["dep:dr-strange-llm"]
# Storage backend, forwarded to core + web. redb is the default; build with
# `--no-default-features --features native-backend,digest` for the hand-rolled
# LSM engine with no redb dependency compiled in.
redb-backend = ["dr-strange-core/redb-backend", "dr-strange-web/redb-backend"]
native-backend = ["dr-strange-core/native-backend", "dr-strange-web/native-backend"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
dr-strange-core = { workspace = true, features = ["json"] }
dr-strange-llm = { path = "../dr-strange-llm", optional = true }
dr-strange-web = { path = "../dr-strange-web" }
dr-strange-log.workspace = true
dr-strange-parser.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
tracing.workspace = true
