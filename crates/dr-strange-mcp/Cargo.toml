[package]
name = "dr-strange-mcp"
description = "MCP server embedding dr-strange-core (arch/06)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "drsg-mcp"
path = "src/main.rs"

[features]
default = ["native-backend"]
# Storage backend, forwarded to core. The hand-rolled LSM engine is the default;
# `redb-backend` selects the legacy v1 engine.
redb-backend = ["dr-strange-core/redb-backend"]
native-backend = ["dr-strange-core/native-backend"]

[dependencies]
mimalloc = { workspace = true }
dr-strange-core = { workspace = true, features = ["json"] }
# Non-optional: the rmcp #[tool_router] macro doesn't compose with #[cfg] on
# individual tool methods, and the MCP server exists to be driven by LLM
# agents, so the `digest` tool (arch/07) is always compiled in.
dr-strange-llm = { path = "../dr-strange-llm" }
dr-strange-log.workspace = true
dr-strange-parser.workspace = true
# `client` + the streamable-http client transport are for `relay`: when a
# repository already runs `drsg serve … watch`, this binary forwards the
# host's stdio session to it instead of opening the database a second time.
# `reqwest` (rmcp's own feature) brings rustls with it, so an https URL in a
# `.mcp.json` works without a second TLS stack.
rmcp = { workspace = true, features = [
    "transport-io",
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }
# The liveness probe's HTTP client. Pinned to the version rmcp itself uses, so
# the relay and the probe share one client crate rather than linking two.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
schemars = "1"
tracing.workspace = true

[dev-dependencies]
# `relay`'s discovery tests write `.mcp.json` files into throwaway trees.
tempfile = "3.27.0"
