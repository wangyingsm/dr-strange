[package]
name = "dr-strange-mcp"
description = "MCP server embedding dr-strange-core (arch/06)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "drsg-mcp"
path = "src/main.rs"

[dependencies]
dr-strange-core = { workspace = true, features = ["json"] }
# Non-optional: the rmcp #[tool_router] macro doesn't compose with #[cfg] on
# individual tool methods, and the MCP server exists to be driven by LLM
# agents, so the `digest` tool (arch/07) is always compiled in.
dr-strange-llm = { path = "../dr-strange-llm" }
dr-strange-log.workspace = true
dr-strange-parser.workspace = true
rmcp = { version = "2.2.0", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
schemars = "1"
tracing.workspace = true
