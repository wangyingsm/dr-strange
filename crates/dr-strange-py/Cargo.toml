[package]
name = "dr-strange-py"
description = "In-process Python bindings for the dr-strange graph engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# `cdylib` is the extension module Python imports; `rlib` keeps the crate
# usable from a Rust test, which is how the conversions below are checked
# without a Python interpreter in the loop.
name = "drsg_embedded"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# Off by default and switched on by maturin. With it the module links against
# no libpython at all, which is what makes a manylinux wheel portable; without
# it an ordinary `cargo` build can still link against the interpreter that is
# installed, so the crate stays buildable inside the workspace gates.
extension-module = ["pyo3/extension-module"]

[dependencies]
# `native-backend` is named rather than left to core's defaults: the workspace
# dependency carries `default-features = false`, and this crate opens a file.
dr-strange-core = { workspace = true, features = ["json", "native-backend"] }
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread"] }
