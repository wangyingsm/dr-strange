[package]
name = "dr-strange-llm"
description = "LLM helpers for dr-strange: embeddings, digestion, entity resolution (arch/07)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Ships ON, per §11: "a plugin system that requires rebuilding the database
# before it can load a plugin is not one." `--no-default-features` drops the
# whole runtime for anyone who does not want it.
#
# The runtime being compiled in is not a plugin running: no module is loaded
# that the configuration did not name, so a default install still executes
# exactly as much third-party code as it did before, which is none.
default = ["plugins"]
plugins = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:sha2", "dep:toml"]

[dependencies]
ahash = { workspace = true }
dr-strange-core = { workspace = true, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
# Server-side document → Markdown for the digest page (arch/07, arch/08).
# Replaces a hand-rolled pdf-extract + unzip-the-docx pair: one crate covers
# doc/docx/odt/rtf/epub/pdf/pptx/xlsx/csv, detects the format from the bytes
# rather than the filename, and emits GitHub-Flavored Markdown — structure the
# extraction pipeline previously threw away. Pure Rust, no C/C++ chain.
# Pinned exactly, not a caret range: it is a young crate (10 releases in its
# first fortnight) sitting in the ingestion path, so a bump should be a decision
# rather than something that happens during someone else's `cargo update`.
anydoc = "=0.1.8"
# Rust source → facts, for the code preprocessor (ROADMAP §11). `visit` for the
# body walkers that find calls and local bindings; `full` because these are
# whole files, not macro fragments.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
# Deterministic, ignore-aware directory walking. `.gitignore` is a project's own
# statement of what is derived rather than source — better than a list this
# crate could guess at — and hand-rolling its precedence, nesting and negation
# rules is a well-known way to be subtly wrong.
ignore = "0.4"
# Preprocessing is CPU-bound, so files parse in parallel. Results are collected
# in input order, never completion order: re-ingesting a repository has to yield
# the same graph.
rayon = "1"
tracing.workspace = true
# ---- the plugin host (ROADMAP §11 slice 2), behind `plugins` ----
# Trimmed hard: the default feature set carries async, three GC strategies,
# threads, stack-switching, profiling, coredump, caching and `wat`, none of
# which a synchronous one-call-per-input host uses.
wasmtime = { version = "47", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
    "std",
], optional = true }
wasmtime-wasi = { version = "47", optional = true }
# Plugin identity: hashed at install, re-checked at every load.
sha2 = { version = "0.10", optional = true }
# `registry.toml` — what is installed, and what it hashed to.
toml = { version = "0.8", optional = true }


[dev-dependencies]
# Preprocessing throughput in MiB/s (ROADMAP §11) — see benches/preprocess.rs.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "preprocess"
harness = false
