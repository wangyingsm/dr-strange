[package]
name = "dr-strange-log"
description = "Tracing subscriber setup for dr-strange binaries — stderr + rolling file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
tracing = { workspace = true }
# `env-filter` isn't in the default set; keep the defaults (fmt, ansi, and the
# `tracing-log` bridge that captures `log`-crate records — that is how the
# document converter's warnings, e.g. "pages need OCR", reach these sinks).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
