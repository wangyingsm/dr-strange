[package]
name = "dr-strange-core"
description = "AI-native embedded graph database — storage, cache, computation, and API layers"
version.workspace = true
edition.workspace = true

[features]
# JSON dialect for the wrapper layers (CLI/MCP). Off by default so the
# library core stays JSON-free (postcard is the durable codec).
json = ["dep:serde_json"]

[dependencies]
moka = { version = "0.12", features = ["sync"] }
postcard = { version = "1.1.3", features = ["use-std"] }
redb = "4.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"
redb = "4.1.0"
serde_json = "1.0.151"
tempfile = "3.27.0"

[[bench]]
name = "graph"
harness = false

[package.metadata.docs.rs]
all-features = true
