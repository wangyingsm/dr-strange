[package]
name = "dr-strange-core"
description = "AI-native embedded graph database — storage, cache, computation, and API layers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["native-backend"]
# JSON dialect for the wrapper layers (CLI/MCP). Off by default so the
# library core stays JSON-free (postcard is the durable codec).
json = ["dep:serde_json"]
# On-disk storage backend for `Database::open`. Exactly one is expected; the
# in-memory engine is always available for tests. `native-backend` (the default)
# selects the hand-rolled LSM engine (arch/01 v2) and, when both are enabled,
# takes precedence over redb. `redb-backend` is the legacy v1 engine, still
# opt-in via `--no-default-features --features redb-backend`.
redb-backend = ["dep:redb"]
native-backend = []

[dependencies]
ahash = { workspace = true, features = ["serde"] }
# Cross-platform advisory file locking (flock / LockFileEx) for the native
# backend's directory lock. `sync` only: the async wrappers pull in a runtime,
# and the lock is taken once, on open.
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
jieba-rs = "0.10.3"
moka = { version = "0.12", features = ["sync"] }
postcard = { version = "1.1.3", features = ["use-std"] }
redb = { version = "4.1.0", optional = true }
# Snowball stemmers for the BM25 keyword index analyzer (ROADMAP §2). Small,
# data-only crate; one per declared index language.
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"
redb = "4.1.0"
serde_json = "1.0.151"
tempfile = "3.27.0"

[[bench]]
name = "graph"
harness = false

[package.metadata.docs.rs]
all-features = true
