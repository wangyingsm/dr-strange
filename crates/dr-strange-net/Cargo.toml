[package]
name = "dr-strange-net"
description = "Outbound network policy for dr-strange: the proxy a request goes through, and the hosts that bypass it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1"
# The proxy grammar a configured value is validated against, and the agent
# config `apply` attaches it to. Pinned exactly for the reason the copy in
# `dr-strange-llm` spells out.
ureq = { version = "=3.4.2", features = ["socks-proxy"] }
# Parsing a destination URL into the host the proxy decision needs.
url = "2"

[lints]
workspace = true
