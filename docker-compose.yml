# Run `drsg serve` in a container with a persistent database volume.
#
#   docker compose up
#
# Pulls the published multi-arch image from GHCR. Then open
# http://localhost:7700. Set DRSG_TOKEN (see below) to allow programmatic
# access from the SDKs or curl. To build locally instead, run
# `docker compose up --build` after adding `build: .` back to the service.

services:
  drsg:
    image: ghcr.io/wangyingsm/dr-strange:latest
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - drsg-data:/data
    environment:
      # Shared bearer token. Unset ⇒ only the same-origin browser UI may call
      # the API; set it to permit SDK / curl access.
      DRSG_TOKEN: ${DRSG_TOKEN:-}
      # Optional LLM provider keys — needed for AIgest, semantic search, and
      # natural-language queries. Supply only the providers you use.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}

volumes:
  drsg-data:
