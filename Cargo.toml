[workspace]
resolver = "3"
members = [
    "crates/dr-strange-core",
    "crates/dr-strange-cli",
    "crates/dr-strange-mcp",
    "crates/dr-strange-web",
    "crates/dr-strange-llm",
    "crates/dr-strange-log",
    "crates/dr-strange-net",
    "crates/dr-strange-parser",
    "crates/dr-strange-py",
    "benchmarks/drsg-bench",
]

[workspace.package]
version = "2.25.0"
edition = "2024"
# 1.95: wasmtime 48 (the plugin sandbox, ROADMAP §11) declares it. Said out
# loud rather than arriving silently — CI tracks stable, which is well past it.
rust-version = "1.95"
authors = ["yingge_gzb@qq.com"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wangyingsm/dr-strange"
homepage = "https://github.com/wangyingsm/dr-strange"

# A function that does not fit on a couple of screens is one nobody re-reads
# before changing it. 100 lines is the limit, checked rather than remembered:
# the threshold lives in `clippy.toml` beside this, and CI's `-D warnings`
# turns it into a build failure. Members opt in with `[lints] workspace = true`.
#
# Clippy counts statements, not the span a symbol occupies — comments and blank
# lines are free, which is the right incentive. Where a body is genuinely one
# indivisible thing (a data table, a dispatch match with a stanza per variant),
# the answer here was to split it anyway rather than to write an `allow`: an
# exception nobody re-examines is how a limit stops meaning anything.
[workspace.lints.clippy]
too_many_lines = "warn"

[workspace.dependencies]
# Every intra-workspace dependency is declared here, with a version beside the
# path: `cargo publish` strips the path and resolves the version from the
# registry, and refuses a manifest that gives it only a path. One place, so a
# release cannot ship a crate that depends on the previous one — `just
# bump-version` rewrites these with the package version and checks it did.
#
# default-features off so each member picks the storage backend (redb/native);
# members that just need core's types (e.g. the parser) get a backend-free core.
dr-strange-core = { path = "crates/dr-strange-core", version = "2.25.0", default-features = false }
dr-strange-log = { path = "crates/dr-strange-log", version = "2.25.0" }
dr-strange-llm = { path = "crates/dr-strange-llm", version = "2.25.0" }
# `default-features = false` for the reason core's line gives: both consumers
# forward the backend choice rather than letting this crate's default decide.
dr-strange-mcp = { path = "crates/dr-strange-mcp", version = "2.25.0", default-features = false }
dr-strange-web = { path = "crates/dr-strange-web", version = "2.25.0" }
# Outbound proxy policy, shared by every crate that makes an outbound request:
# the LLM client, the web fetcher and the MCP relay. Its own crate because the
# relay reaching into `dr-strange-llm` for it said something untrue about what
# the policy is for.
dr-strange-net = { path = "crates/dr-strange-net", version = "2.25.0" }
dr-strange-parser = { path = "crates/dr-strange-parser", version = "2.25.0" }
# The workspace-standard hash map/set (fast keyed hashing, DoS-resistant via
# per-process random seed): use ahash::{AHashMap, AHashSet} instead of std's
# SipHash-backed collections everywhere.
ahash = "0.8"
# Process allocator for the BINARY crates only (never the libraries — the
# allocator is a process-global choice the embedding application makes).
mimalloc = "0.1"
# MCP. Pinned here rather than per crate because it is a *type* boundary
# between them: `DrStrange` implements dr-strange-mcp's `Service<RoleServer>`
# and is handed to dr-strange-web's `StreamableHttpService`, so two independent
# specs drifting across a semver-incompatible bump would surface as a baffling
# "expected rmcp::…, found rmcp::…" mismatch instead of a version conflict.
# Default features stay on — they carry the `#[tool_router]` / `#[tool]` macros
# the tool set is written with. Features are additive per package across the
# build graph, so each member names only the transports it drives.
rmcp = "3.5.1"
thiserror = "2"
tracing = "0.1"
